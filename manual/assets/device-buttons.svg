<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 74 100" role="img" aria-label="RST, BOOT and power switch on the side of the display">
  <!-- Board outline, 30 x 78 mm at true proportion. -->
  <rect x="14" y="8" width="30" height="78" rx="2.4" fill="#f4f7fa" stroke="#22303f" stroke-width="0.7"/>

  <!-- Screen area, 320 x 820 portrait. -->
  <rect x="17.4" y="14" width="23" height="59" rx="1.2" fill="#101826"/>
  <rect x="17.4" y="26" width="23" height="19" fill="#c44770"/>
  <rect x="20" y="30" width="9" height="1" fill="#ffffff" opacity=".85"/>
  <rect x="20" y="34" width="14" height="1.6" fill="#f2c94c"/>
  <rect x="20" y="44" width="8" height="1" fill="#ffffff" opacity=".7"/>
  <rect x="17.4" y="55" width="23" height="0.6" fill="#1b4d8f" opacity=".5"/>
  <rect x="20" y="66" width="10" height="1" fill="#f2c94c"/>

  <!-- Right-edge tact switches: RST, BOOT (10.8 mm lower), power SWITCH (22.7 mm lower). -->
  <rect x="44" y="26.5" width="4.6" height="3.4" rx="1" fill="#e3e9f0" stroke="#22303f" stroke-width="0.6"/>
  <rect x="44" y="37.5" width="4.6" height="3.4" rx="1" fill="#e3e9f0" stroke="#22303f" stroke-width="0.6"/>
  <rect x="44" y="60.5" width="4.6" height="3.4" rx="1" fill="#e3e9f0" stroke="#22303f" stroke-width="0.6"/>
  <text x="42.6" y="29.2" font-family="Helvetica Neue, Arial, sans-serif" font-size="2.7" fill="#45526a" text-anchor="end">RST</text>
  <text x="42.6" y="40.2" font-family="Helvetica Neue, Arial, sans-serif" font-size="2.7" fill="#45526a" text-anchor="end">BOOT</text>
  <text x="42.6" y="63.2" font-family="Helvetica Neue, Arial, sans-serif" font-size="2.7" fill="#45526a" text-anchor="end">SWITCH</text>

  <!-- USB-C at the bottom edge, for orientation. -->
  <rect x="25" y="85" width="8" height="3.4" rx="1.2" fill="#e3e9f0" stroke="#22303f" stroke-width="0.6"/>
  <text x="29" y="94" font-family="Helvetica Neue, Arial, sans-serif" font-size="2.7" fill="#6b7583" text-anchor="middle">USB-C</text>

  <!-- Number badges, matched by the legend beside the figure. -->
  <circle cx="56" cy="28.2" r="3.1" fill="#f2c94c"/>
  <circle cx="56" cy="39.2" r="3.1" fill="#f2c94c"/>
  <circle cx="56" cy="62.2" r="3.1" fill="#f2c94c"/>
  <text x="56" y="29.3" font-family="Helvetica Neue, Arial, sans-serif" font-size="3.4" font-weight="700" fill="#0d1f33" text-anchor="middle">1</text>
  <text x="56" y="40.3" font-family="Helvetica Neue, Arial, sans-serif" font-size="3.4" font-weight="700" fill="#0d1f33" text-anchor="middle">2</text>
  <text x="56" y="63.3" font-family="Helvetica Neue, Arial, sans-serif" font-size="3.4" font-weight="700" fill="#0d1f33" text-anchor="middle">3</text>
  <line x1="48.6" y1="28.2" x2="52.9" y2="28.2" stroke="#c8b25e" stroke-width="0.4"/>
  <line x1="48.6" y1="39.2" x2="52.9" y2="39.2" stroke="#c8b25e" stroke-width="0.4"/>
  <line x1="48.6" y1="62.2" x2="52.9" y2="62.2" stroke="#c8b25e" stroke-width="0.4"/>
</svg>
